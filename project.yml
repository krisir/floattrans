name: FloatTrans
options:
  bundleIdPrefix: cc.kristar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  # Xcode 26.5 -> LastUpgradeCheck 2650; keeps "Update to recommended settings" quiet.
  xcodeVersion: "26.5"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
configs:
  Debug: debug
  Release: release
targets:
  FloatTrans:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LiveEnglish
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: FloatTrans
        PRODUCT_BUNDLE_IDENTIFIER: cc.kristar.floattrans
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LiveEnglish.entitlements
        PRODUCT_MODULE_NAME: LiveEnglish
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 浮译
        INFOPLIST_KEY_CFBundleName: 浮译
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets:
        - LiveEnglishTests
      gatherCoverageData: false
  LiveEnglishTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/LiveEnglishTests
    dependencies:
      - target: FloatTrans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liveenglish.tests
        GENERATE_INFOPLIST_FILE: YES
